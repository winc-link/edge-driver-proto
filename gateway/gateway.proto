syntax = "proto3";
package gateway;
option go_package = "github.com/winc-link/edge-driver-proto/gateway";
import "drivercommon/common.proto";

service RpcGateway {
  rpc GatewayControl(GatewayControlReq) returns (GateWayInfoResponse) {}
}

enum ControlType {
  REBOOT = 0;                // 重启
  RESET_PASSWORD = 1;        // 重置密码
  CLEAN_LOG = 2;             // 清理日志
  FACTORY_RESET = 3;         // 格式化
  CLEAN_TF_CARD = 4;         // TF 卡格式化
  GATEWAY_STATUS_REPORT = 5; // 网关状态上报
  TRIGGER_BUZZER = 6;        // 蜂鸣器响铃
  DEVICE_ADD = 7;            // 设备添加
  DEVICE_BATCH_ADD = 8;      // 设备批量添加
  DEVICE_DEL = 9;            // 设备删除
  DEVICE_BATCH_DEL = 10;     // 设备批量删除
};

message GatewayControlReq{
  string gatewaySn = 1; // 下发的目标设备id
  ControlType controlType = 2;
  string data = 3;
}

message GateWayInfoResponse {
  drivercommon.CommonResponse baseResponse = 1;
}